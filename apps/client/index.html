      #lw-splash {

        background: radial-gradient(120% 70% at 50% 0%, #2E3456 0%, transparent 70%), #12152B;

      #lw-splash.lw-splash--out { opacity: 0; visibility: hidden; }
      .lw-splash-lantern { position: relative; width: 84px; transform-origin: 50% 0; animation: lw-splash-swing 2.2s ease-in-out infinite alternate; }
      .lw-splash-lantern::before {
        content: ''; position: absolute; inset: -70% -110%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 200, 87, 0.45), rgba(255, 159, 28, 0.12) 55%, transparent);
        animation: lw-splash-glow 1.4s ease-in-out infinite alternate;
      }
      .lw-splash-lantern svg { position: relative; display: block; width: 100%; height: auto; }
      @keyframes lw-splash-swing { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
      @keyframes lw-splash-glow { from { opacity: 0.55; transform: scale(0.94); } to { opacity: 1; transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .lw-splash-lantern, .lw-splash-lantern::before { animation: none; } }
